name: Sakura E2E

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  e2e:
    name: Dispatcher and launcher E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run E2E tests
        run: |
          compose_file=tests/compose/docker-compose.test.yml
          docker compose --file "$compose_file" up --build --detach
          e2e_container="$(docker compose --file "$compose_file" ps --quiet e2e)"

          while [ "$(docker inspect --format '{{.State.Status}}' "$e2e_container")" != "exited" ]; do
            sleep 2
          done

          exit "$(docker inspect --format '{{.State.ExitCode}}' "$e2e_container")"

      - name: Collect E2E logs
        if: always()
        run: docker compose --file tests/compose/docker-compose.test.yml logs --no-color

      - name: Tear down E2E environment
        if: always()
        run: docker compose --file tests/compose/docker-compose.test.yml down --volumes --remove-orphans
