name: Continuous Integration(Dispatcher)

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
      - develop

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dispatcher/paramiko

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            dispatcher/paramiko

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "dispatcher/paramiko/.python-version"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run tests
        run: pytest

      - name: Docker build
        run: docker build -f Dockerfile ..
