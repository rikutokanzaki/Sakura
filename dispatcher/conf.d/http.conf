server {
  listen 80;
  server_name _;

  location / {
    rewrite_by_lua_file /usr/local/openresty/nginx/lua/detect_http.lua;
    proxy_pass http://app:80;
  }

  location @snare {
    proxy_pass http://snare:80;
  }
}

server {
  listen 5000;
  server_name _;

  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  location / {
    proxy_pass http://launcher:5000;
  }
}