server {
  listen 80;
  server_name _;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  location / {
    rewrite_by_lua_file /etc/nginx/lua/detect_http.lua;
    proxy_pass http://heralding:80;
  }

  location @h0neytr4p {
    proxy_pass http://h0neytr4p:80;
  }
}

server {
  listen 5000;
  server_name _;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  location / {
    proxy_pass http://launcher:5000;
  }
}