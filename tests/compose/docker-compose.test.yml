services:
  paramiko:
    container_name: paramiko
    build:
      context: ../..
      dockerfile: dispatcher/paramiko/Dockerfile
    depends_on:
      - launcher
      - heralding
      - cowrie
    environment:
      DISPATCHER_MODE: rotate
      ROTATE_INTERVAL: 2
      SELECTED_PROFILE: standard
      SESSION_TIMEOUT: 3
      HOST_NAME: e2e

  openresty:
    container_name: openresty
    build:
      context: ../..
      dockerfile: dispatcher/openresty/Dockerfile
    command:
      - sh
      - -c
      - mkdir -p /var/log/nginx && touch /var/log/nginx/access.log && exec openresty -g 'daemon off;'
    depends_on:
      - launcher
      - heralding
      - wordpot
      - h0neytr4p
    environment:
      DISPATCHER_MODE: rotate
      ROTATE_INTERVAL: 2
      SELECTED_PROFILE: standard
      SESSION_TIMEOUT: 3
    volumes:
      - openresty-logs:/var/log/nginx

  launcher:
    container_name: launcher
    build:
      context: ../..
      dockerfile: launcher/Dockerfile
    depends_on:
      - heralding
      - cowrie
      - wordpot
      - h0neytr4p
    environment:
      SESSION_TIMEOUT: 3
      ALLOWED_NETWORKS: 0.0.0.0/0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  heralding:
    container_name: heralding
    image: ghcr.io/telekom-security/heralding:24.04.1
    user: "0:0"
    tmpfs:
      - /tmp/heralding:uid=2000,gid=2000
      - /var/log/heralding
    restart: always
    read_only: true

  cowrie:
    container_name: cowrie
    image: cowrie/cowrie
    volumes:
      - ../fixtures/backends/cowrie/userdb.txt:/cowrie/cowrie-git/etc/userdb.txt
    environment:
      - PYTHONUNBUFFERED=1
      - COWRIE_TTYLOG_ENABLED=yes
      - COWRIE_SSH_PORT=2222
    restart: always

  wordpot:
    container_name: wordpot
    image: ghcr.io/telekom-security/wordpot:24.04.1
    user: "2000:2000"
    tmpfs:
      - /opt/wordpot/logs:uid=2000,gid=2000,mode=755
    restart: always

  h0neytr4p:
    container_name: h0neytr4p
    image: ghcr.io/telekom-security/h0neytr4p:24.04.1
    user: "2000:2000"
    tmpfs:
      - /opt/h0neytr4p/log:uid=2000,gid=2000,mode=755
      - /data/h0neytr4p/payloads:uid=2000,gid=2000,mode=755
    restart: always

  e2e:
    build:
      context: ../..
      dockerfile: tests/e2e/Dockerfile
    depends_on:
      - paramiko
      - openresty
      - launcher
    volumes:
      - openresty-logs:/logs/openresty:ro

volumes:
  openresty-logs:
