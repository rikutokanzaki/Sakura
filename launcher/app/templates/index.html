<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/style.css">
  <title>Sakura launcher</title>
</head>

<body>
  <div class="titleSection">
    <h1 class="title">Sakura launcher</h1>
  </div>

  <div class="launchHoneypot">
    <select class="dropdown" name="honeypots" id="honeypotSelect">
      <option value="cowrie">Cowrie</option>
      <option value="snare">Snare</option>
    </select>

    <button class="launchButton">Launch</button>
  </div>

  <div class="honeypotLogs" id="h0neytr4p">
    <h2 class="honeypotName">H0neytr4p</h2>
    <div class="logControls">
      <label for="logCountSelectH0neytr4p">Display:</label>
      <select class="dropdown" id="logCountSelectH0neytr4p">
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="all">All</option>
      </select>
    </div>

    <div class="table-wrap">
      <table class="logTable" id="h0neytr4pTable">
      </table>
    </div>
  </div>

  <div class="honeypotLogs" id="snare">
    <h2 class="honeypotName">Snare</h2>
    <div class="logControls">
      <label for="logCountSelectSnare">Display:</label>
      <select class="dropdown" id="logCountSelectSnare">
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="all">All</option>
      </select>
    </div>

    <div class="table-wrap">
      <table class="logTable" id="snareTable">
      </table>
    </div>
  </div>

  <div class="honeypotLogs" id="cowrie">
    <h2 class="honeypotName">Cowrie</h2>
    <div class="logControls">
      <label for="logCountSelectCowrie">Display:</label>
      <select class="dropdown" id="logCountSelectCowrie">
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="all">All</option>
      </select>
    </div>

    <div class="table-wrap">
      <table class="logTable" id="cowrieTable">
      </table>
    </div>
  </div>
  
  <script src="/static/main.js"></script>
</body>
</html>
