<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/style.css">
  <title>Sakura launcher</title>
</head>

<body>
  <div class="titleSection">
    <h1 class="title">Sakura launcher</h1>
  </div>

  <div class="launchHoneypot">
    <select class="dropdown" name="honeypots" id="honeypotSelect">
      <option value="cowrie">Cowrie</option>
    </select>

    <button class="launchButton">Launch</button>
  </div>

  <div class="honeypotLogs">

    <div class="logControls">
      <label for="logCountSelect">Show:</label>
      <select class="dropdown" id="logCountSelect">
        <option value="10">10</option>
        <option value="20">20</option>
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="all">All</option>
      </select>
    </div>

    <div class="table-wrap">
      <table class="logTable">
      </table>
    </div>
  </div>
  
  <script src="/static/main.js"></script>
</body>
</html>
