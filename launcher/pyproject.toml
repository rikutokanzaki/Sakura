[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "launcher"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "blinker>=1.9.0",
  "certifi>=2026.7.22",
  "charset-normalizer>=3.5.1",
  "click>=8.5.0",
  "docker>=7.2.0",
  "Flask>=3.1.3",
  "gunicorn>=26.2.0",
  "idna>=3.20",
  "itsdangerous>=2.2.0",
  "Jinja2>=3.1.6",
  "MarkupSafe>=3.0.3",
  "python-dotenv>=1.2.3",
  "requests>=2.34.2",
  "urllib3>=2.8.0",
  "Werkzeug>=3.1.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
  "templates/*.html",
  "static/*",
]
